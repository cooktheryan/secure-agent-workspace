apiVersion: cirrus.ibm.com/v1alpha1
kind: Server
metadata:
  name: saw-agent
  namespace: ${NS}
  labels:
    app.kubernetes.io/name: secure-agent-workspace
    app.kubernetes.io/component: saw-agent
spec:
  cloudInit:
    userData: |
      #cloud-config
      name: cloudinitdisk
      hostname: saw-agent
      users:
        - default
        - name: openshell
          gecos: OpenShell service account
          lock_passwd: true
          shell: /bin/bash
      runcmd:
        - |
          set -eu
          install -d -m 0750 /etc/openshell-saw
          vars_device=""
          for attempt in 1 2 3 4 5; do
            vars_device="$(lsblk -rpno NAME,SERIAL | awk '$2=="VARS01"{print $1;exit}')"
            if [ -n "${vars_device}" ]; then
              break
            fi
            sleep 10
          done
          test -n "${vars_device}"
          mount "${vars_device}" /etc/openshell-saw
          checkout=/opt/secure-agent-workspace
          install -d -m 0755 "${checkout}"
          # Gist-based bootstrap is deprecated; use this versioned repository branch.
          curl -fsSL --retry 5 --retry-delay 10 \
            https://github.com/cooktheryan/secure-agent-workspace/archive/refs/heads/feat/openclaw-saw-demo-clean.tar.gz \
            | tar -xz --strip-components=1 -C "${checkout}"
          usermod --add-subuids 100000-165535 --add-subgids 100000-165535 openshell 2>/dev/null || true
          cat >/usr/local/sbin/saw-provision-debug-server <<'PY'
          #!/usr/bin/env python3
          import html
          import re
          import subprocess
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          LOG_PATH = "/var/log/saw-provision.log"

          def command_output(args):
              try:
                  return subprocess.run(
                      args,
                      check=False,
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      timeout=20,
                  ).stdout
              except Exception as exc:
                  return f"{type(exc).__name__}: {exc}\n"

          def redact(text):
              text = re.sub(
                  r"-----BEGIN [A-Z ]*PRIVATE KEY-----.*?-----END [A-Z ]*PRIVATE KEY-----",
                  "<redacted private key>",
                  text,
                  flags=re.S,
              )
              text = re.sub(r"sk-[A-Za-z0-9_-]+", "sk-<redacted>", text)
              text = re.sub(
                  r"(?im)^([A-Za-z0-9_.-]*(?:api[_-]?key|token|password|secret)[A-Za-z0-9_.-]*\\s*[:=]\\s*).*$",
                  r"\\1<redacted>",
                  text,
              )
              return text

          def tail_log():
              return command_output(["/usr/bin/tail", "-n", "420", LOG_PATH])

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path in ("/healthz", "/readyz"):
                      body = "ok\n"
                  elif self.path == "/status":
                      body = command_output(["/usr/bin/systemctl", "status", "saw-provision.service", "--no-pager", "-l"])
                  elif self.path == "/journal":
                      body = command_output(["/usr/bin/journalctl", "-u", "saw-provision.service", "-n", "260", "--no-pager"])
                  elif self.path == "/log":
                      body = tail_log()
                  else:
                      body = "saw provision diagnostics\\n\\nGET /healthz\\nGET /status\\nGET /journal\\nGET /log\\n"
                  body = redact(body)
                  payload = html.escape(body).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain; charset=utf-8")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def log_message(self, fmt, *args):
                  return

          ThreadingHTTPServer(("0.0.0.0", 18080), Handler).serve_forever()
          PY
          chmod 0755 /usr/local/sbin/saw-provision-debug-server
          cat >/etc/systemd/system/saw-provision-log-http.service <<'UNIT'
          [Unit]
          Description=SAW provisioning diagnostic HTTP endpoint
          After=network-online.target
          Wants=network-online.target

          [Service]
          ExecStart=/usr/local/sbin/saw-provision-debug-server
          Restart=on-failure
          RestartSec=2

          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now saw-provision-log-http.service
          systemd-run --unit=saw-provision.service --setenv=HOME=/root /usr/bin/bash -c 'exec /usr/bin/ansible-playbook -i localhost, /opt/secure-agent-workspace/cloud-init/ansible/site.yml -e @/etc/openshell-saw/vars.yml > /var/log/saw-provision.log 2>&1'
  containerDiskImage: registry.cirrus.ibm.com/mici-golden-images/cirrus-rhel-9-golden-image:master-e4b3a21-20260707-093716
  operatingSystem: ""
  profile: c4.m24
  running: true
  ports:
    - name: userport
      port: 18789
      protocol: TCP
    - name: provisionlog
      port: 18080
      protocol: TCP
  mounts:
    - name: vars-secret
      serial: VARS01
      volume:
        secret:
          secretName: saw-agent-vars
    - name: persistent-state
      serial: SAWAGENTSTATE
      volume:
        persistentVolumeClaim:
          claimName: saw-agent-state-persist
          readOnly: false
    - name: persistent-assets
      serial: SAWAGENTASSETS
      volume:
        persistentVolumeClaim:
          claimName: saw-agent-assets-persist
          readOnly: false
