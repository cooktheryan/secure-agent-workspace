apiVersion: cirrus.ibm.com/v1alpha1
kind: Server
metadata:
  name: saw-agent
  namespace: ${NS}
  labels:
    app.kubernetes.io/name: secure-agent-workspace
    app.kubernetes.io/component: saw-agent
spec:
  cloudInit:
    userData: |
      #cloud-config
      name: cloudinitdisk
      hostname: saw-agent
      users:
        - default
        - name: openshell
          gecos: OpenShell service account
          lock_passwd: true
          shell: /bin/bash
      runcmd:
        - |
          set -eu
          curl -fsSL --retry 5 --retry-delay 10 \
            https://raw.githubusercontent.com/cooktheryan/secure-agent-workspace/feat/openclaw-demo-alignment/cloud-init/files/bootstrap-server.sh \
            -o /tmp/saw-bootstrap-server.sh
          bash /tmp/saw-bootstrap-server.sh
  containerDiskImage: registry.cirrus.ibm.com/mici-golden-images/cirrus-rhel-9-golden-image:master-e4b3a21-20260707-093716
  operatingSystem: ""
  profile: c4.m24
  running: true
  ports:
    - name: userport
      port: 18789
      protocol: TCP
    - name: provisionlog
      port: 18080
      protocol: TCP
  mounts:
    - name: vars-secret
      serial: VARS01
      volume:
        secret:
          secretName: saw-agent-vars
    - name: persistent-state
      serial: SAWAGENTSTATE
      volume:
        persistentVolumeClaim:
          claimName: saw-agent-state-persist
          readOnly: false
    - name: persistent-assets
      serial: SAWAGENTASSETS
      volume:
        persistentVolumeClaim:
          claimName: saw-agent-assets-persist
          readOnly: false
