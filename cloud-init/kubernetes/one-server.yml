apiVersion: cirrus.ibm.com/v1alpha1
kind: Server
metadata:
  name: one
  namespace: ${NS}
  labels:
    app.kubernetes.io/name: secure-agent-workspace
    app.kubernetes.io/component: two-vm-agent
spec:
  cloudInit:
    userData: |
      #cloud-config
      name: cloudinitdisk
      hostname: one
      users:
        - default
        - name: openshell
          gecos: OpenShell service account
          lock_passwd: true
          shell: /bin/bash
      runcmd:
        - |
          set -euo pipefail
          install -d -m 0750 /etc/openshell-saw
          vars_device=""
          for attempt in 1 2 3 4 5; do
            vars_device="$(lsblk --nodeps --noheadings --output NAME,SERIAL | grep -m1 'VARS01' | awk '{print $1}')" || true
            if [ -n "${vars_device}" ]; then
              break
            fi
            sleep 15
          done
          test -n "${vars_device}"
          mount "/dev/${vars_device}" /etc/openshell-saw
          packages="telnet git ansible-core podman fuse-overlayfs slirp4netns curl jq lsof qemu-guest-agent openssh-clients openssh-server binutils nodejs python3-pip ca-certificates"
          installed=false
          for attempt in 1 2 3 4 5; do
            if dnf install -y ${packages}; then
              installed=true
              break
            fi
            sleep 15
          done
          test "${installed}" = true
          saw_git_repo='https://github.com/rh-forge/secure-agent-workspace.git'
          saw_git_ref='main'
          checkout=/opt/secure-agent-workspace
          install -d -m 0755 "${checkout}"
          git -C "${checkout}" init
          git -C "${checkout}" remote add origin "${saw_git_repo}"
          fetched=false
          for attempt in 1 2 3 4 5; do
            if git -C "${checkout}" fetch --depth 1 origin "${saw_git_ref}"; then
              fetched=true
              break
            fi
            sleep 15
          done
          test "${fetched}" = true
          git -C "${checkout}" checkout --detach FETCH_HEAD
          usermod --add-subuids 100000-165535 --add-subgids 100000-165535 openshell 2>/dev/null || true
          systemctl enable --now qemu-guest-agent.service
          systemd-run --unit=saw-provision.service --setenv=HOME=/root /usr/bin/bash -c 'exec /usr/bin/ansible-playbook -i localhost, /opt/secure-agent-workspace/cloud-init/ansible/site.yml -e @/etc/openshell-saw/vars.yml > /var/log/saw-provision.log 2>&1'
  containerDiskImage: registry.cirrus.ibm.com/mici-golden-images/cirrus-rhel-9-golden-image:master-e4b3a21-20260707-093716
  operatingSystem: ""
  profile: c4.m24
  running: true
  ports:
    - name: userport
      port: 18789
      protocol: TCP
  mounts:
    - name: vars-secret
      serial: VARS01
      volume:
        secret:
          secretName: one-vars
