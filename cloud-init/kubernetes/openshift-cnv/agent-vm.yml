apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: saw-agent
  namespace: ${NS}
  labels:
    app.kubernetes.io/name: secure-agent-workspace
    app.kubernetes.io/component: saw-agent
spec:
  running: true
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saw-agent
    spec:
      domain:
        cpu:
          cores: 4
        resources:
          requests:
            memory: 8Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
                  protocol: TCP
                - name: userport
                  port: 18789
                  protocol: TCP
                - name: forgeui
                  port: 18090
                  protocol: TCP
        firmware:
          bootloader:
            efi:
              secureBoot: false
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: saw-agent-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: saw-agent
              users:
                - default
                - name: openshell
                  gecos: OpenShell service account
                  lock_passwd: true
                  shell: /bin/bash
                  ssh_authorized_keys:
                    - ${SSH_PUBKEY}
              runcmd:
                - |
                  set -eu
                  checkout=/opt/secure-agent-workspace
                  install -d -m 0755 "${checkout}"
                  curl -fsSL --retry 5 --retry-delay 10 \
                    https://github.com/rh-forge/secure-agent-workspace/archive/refs/heads/${BRANCH:-main}.tar.gz \
                    | tar -xz --strip-components=1 -C "${checkout}"
                  usermod --add-subuids 100000-165535 --add-subgids 100000-165535 openshell 2>/dev/null || true
  dataVolumeTemplates:
    - metadata:
        name: saw-agent-root
      spec:
        source:
          pvc:
            name: ${GOLDEN_IMAGE_PVC:-openshell-gateway-podman-golden}
            namespace: ${NS}
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 40Gi
