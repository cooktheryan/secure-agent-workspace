apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: saw-integration
  namespace: ${NS}
  labels:
    app.kubernetes.io/name: secure-agent-workspace
    app.kubernetes.io/component: saw-integration
spec:
  running: true
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saw-integration
    spec:
      domain:
        cpu:
          cores: 2
        resources:
          requests:
            memory: 4Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
                  protocol: TCP
                - name: gmail-read
                  port: 18080
                  protocol: TCP
                - name: gmail-write
                  port: 18081
                  protocol: TCP
                - name: m365-read
                  port: 18082
                  protocol: TCP
                - name: inference
                  port: 18083
                  protocol: TCP
                - name: slack-read
                  port: 18084
                  protocol: TCP
                - name: slack-write
                  port: 18085
                  protocol: TCP
                - name: m365-write
                  port: 18086
                  protocol: TCP
        firmware:
          bootloader:
            efi:
              secureBoot: false
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: saw-integration-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: saw-integration
              users:
                - default
                - name: openshell
                  gecos: OpenShell service account
                  lock_passwd: true
                  shell: /bin/bash
                  ssh_authorized_keys:
                    - ${SSH_PUBKEY}
              runcmd:
                - |
                  set -eu
                  checkout=/opt/secure-agent-workspace
                  install -d -m 0755 "${checkout}"
                  curl -fsSL --retry 5 --retry-delay 10 \
                    https://github.com/rh-forge/secure-agent-workspace/archive/refs/heads/${BRANCH:-main}.tar.gz \
                    | tar -xz --strip-components=1 -C "${checkout}"
  dataVolumeTemplates:
    - metadata:
        name: saw-integration-root
      spec:
        source:
          http:
            url: "${BASE_IMAGE_URL:-https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2}"
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 40Gi
